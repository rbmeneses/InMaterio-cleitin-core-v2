*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--navy);color:var(--white);font-family:Consolas,"Courier New",monospace}
header{height:auto;min-height:70px;padding:14px 18px;border-bottom:1px solid #31516d;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

#viewport{height:calc(100% - 84px);overflow:hidden;position:relative;cursor:grab;background-color:var(--navy);background-image:radial-gradient(#21415e 0.7px,transparent .7px);background-size:18px 18px}

.frame{fill:none;stroke:#41627d;stroke-width:2}.gridline{stroke:#183652;stroke-width:1;fill:none}.box{fill:#0d2340;stroke:#fff;stroke-width:1.5}.box-cyan{fill:#0d2340;stroke:var(--cyan);stroke-width:2}.box-warn{fill:#261f2a;stroke:var(--amber);stroke-width:1.5}

.pin{fill:#0a192f;stroke:#fff;stroke-width:1}.pintext{fill:#fff;font-size:9px}
.trace{fill:none;stroke:var(--cyan);stroke-width:2.1;stroke-linejoin:round;stroke-linecap:square;opacity:.84;vector-effect:non-scaling-stroke;cursor:pointer}
.trace.white{stroke:#fff;stroke-width:1.45}.trace.power{stroke:var(--amber);stroke-width:1.8}.trace.signal{stroke:var(--cyan)}
.trace:hover,.trace.active{stroke:#fff;stroke-width:4;opacity:1;filter:drop-shadow(0 0 5px var(--cyan))}
.pulse{fill:none;stroke:#00ff88;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 8px #00ff88);pointer-events:none;opacity:0}
.trace-label{fill:#d9faff;font-size:9px;paint-order:stroke;stroke:var(--navy);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.ic{fill:#071323;stroke:#fff;stroke-width:1.6}.notch{fill:none;stroke:#fff;stroke-width:1.2}.node{fill:var(--cyan)}.section{fill:#0b2039;stroke:#45627c;stroke-width:1.2}.bom{fill:#09182b;stroke:#fff;stroke-width:1}.bomtext{fill:#fff;font-size:9px}.bomhead{fill:var(--cyan);font-size:11px;font-weight:bold}
.note{fill:#271f1c;stroke:var(--amber);stroke-width:1.3}.notetext{fill:#ffe3a1;font-size:10px}.legendtext{fill:#fff;font-size:10px}
#tip{position:absolute;bottom:12px;left:12px;padding:8px 10px;background:#061323;border:1px solid #00f0ff;color:#d9faff;font-size:11px;pointer-events:none}

<script>
const NS = 'http://www.w3.org/2000/svg';

// 1. Renderiza as 16 folhas (U3 a U6)
const leaves = document.getElementById('leaves');
if (leaves) {
  const caps = ['100nF','100nF','100nF','100nF','22nF','22nF','22nF','22nF','4.7nF','4.7nF','4.7nF','4.7nF','10nF','10nF','10nF','10nF'];
  for (let i = 0; i < 16; i++) {
    const col = i % 4, row = Math.floor(i / 4), x = 1065 + col * 132, y = 665 + row * 29;
    const g = document.createElementNS(NS, 'g');
    g.innerHTML = `<rect x="${x}" y="${y}" width="120" height="23" class="box"/><text x="${x+6}" y="${y+15}" class="tiny">F${i+1} · U${3+Math.floor(i/4)} / A${i%4+1}</text><text x="${x+72}" y="${y+15}" class="tiny cyan">${caps[i]}</text>`;
    leaves.appendChild(g);
  }
}

// 2. Tabela BOM
const bomContainer = document.getElementById('bomRows');
if (bomContainer) {
  bomContainer.innerHTML = `<text x="1065" y="935" class="bomhead">GRUPO</text><text x="1245" y="935" class="bomhead">ITEM</text><text x="1690" y="935" class="bomhead">QTD / VALOR</text><text x="1850" y="935" class="bomhead">OBSERVAÇÃO</text><path d="M1055 945H2115" stroke="#00f0ff"/>`;
  const bomData = [
    ['SEMICONDUTORES','ESP32 DevKit V1 / WROOM-32','1 un.','Ponte USB 2 Mbps + Dual DAC + ADC1'],
    ['','NE5532P DIP-8','1 un.','Tronco + Buffer Vrest'],
    ['','TL074CN DIP-14','5 un.','1 Ramo + 4 Folhas = 20 OpAmps'],
    ['','CD74HC4067E DIP-24','1 un.','Multiplexador analógico 16:1 (100 kHz)'],
    ['','MCP23017-E/SP DIP-28','2 un.','32 portas I/O via I2C (0x20 e 0x21)'],
    ['','IRLZ44N TO-220','2 un.','MOSFET Logic-Level para Cooler e Heater'],
    ['PASSIVOS','Resistores & Capacitores','1 kit','Malhas RC de acoplamento e divisores ADC'],
    ['TÉRMICA','Termistor NTC 10k + Aquecedor','1 conj.','Controle térmico de Johnson-Nyquist']
  ];
  bomData.forEach((r, i) => {
    const y = 966 + i * 22;
    const cols = [1065, 1245, 1690, 1850];
    cols.forEach((xPos, idx) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', xPos); t.setAttribute('y', y);
      t.setAttribute('class', 'bomtext'); t.textContent = r[idx];
      bomContainer.appendChild(t);
    });
  });
}

// 3. Zoom, Pan e Controles
const svg = document.getElementById('blueprint'), world = document.getElementById('world'), vp = document.getElementById('viewport'), tip = document.getElementById('tip'), zoomInd = document.getElementById('zoomIndicator');
let scale = 1.0, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;

function applyTransform() {
  world.setAttribute('transform', `translate(${tx} ${ty}) scale(${scale})`);
  if (zoomInd) zoomInd.textContent = `${Math.round(scale * 100)}%`;
}

function zoom(factor, cx = 1100, cy = 750) {
  const nextScale = Math.max(0.35, Math.min(3.5, scale * factor));
  tx = cx - (cx - tx) * (nextScale / scale);
  ty = cy - (cy - ty) * (nextScale / scale);
  scale = nextScale;
  applyTransform();
}

document.getElementById('zoomIn').addEventListener('click', () => zoom(1.25));
document.getElementById('zoomOut').addEventListener('click', () => zoom(0.8));
document.getElementById('reset').addEventListener('click', () => { scale = 1.0; tx = 0; ty = 0; applyTransform(); });

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ((e.clientX - rect.left) / rect.width) * 2200;
  const my = ((e.clientY - rect.top) / rect.height) * 1500;
  zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, mx, my);
}, { passive: false });

svg.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  dragging = true; vp.classList.add('dragging');
  sx = e.clientX; sy = e.clientY; ox = tx; oy = ty;
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e => {
  if (!dragging) return;
  const rect = svg.getBoundingClientRect();
  tx = ox + (e.clientX - sx) * (2200 / rect.width);
  ty = oy + (e.clientY - sy) * (1500 / rect.height);
  applyTransform();
});

svg.addEventListener('pointerup', e => {
  dragging = false; vp.classList.remove('dragging');
  if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);
});

// --- SIMULAÇÃO AO VIVO DE PULSOS ELÉTRICOS ---
let simActive = false;
let simInterval = null;
const simBtn = document.getElementById('simToggle');

const pathsToSimulate = ['path-dac1', 'path-dac2', 'path-mux', 'path-adc', 'path-i2c'];

function triggerPulse(pathId) {
  const pathEl = document.getElementById(pathId);
  const pulseEl = document.getElementById('pulse-' + pathId.replace('path-', ''));
  if (!pathEl || !pulseEl) return;

  const length = pathEl.getTotalLength();
  pulseEl.style.opacity = '1';
  
  let startTime = null;
  const duration = 900; // Duração da animação do pulso em ms

  function animatePulse(timestamp) {
    if (!startTime) startTime = timestamp;
    const progress = (timestamp - startTime) / duration;
    
    if (progress < 1) {
      const point = pathEl.getPointAtLength(progress * length);
      pulseEl.setAttribute('cx', point.x);
      pulseEl.setAttribute('cy', point.y);
      requestAnimationFrame(animatePulse);
    } else {
      pulseEl.style.opacity = '0';
    }
  }
  requestAnimationFrame(animatePulse);
}

simBtn.addEventListener('click', () => {
  simActive = !simActive;
  if (simActive) {
    simBtn.classList.add('running');
    simBtn.textContent = '⏹ PARAR SIMULAÇÃO';
    tip.textContent = 'Simulação ao Vivo Ativa: Pulsos elétricos a circular pelas trilhas do ESP32 e CIs.';
    
    // Dispara pulsos em loop intervalado nas principais vias
    simInterval = setInterval(() => {
      const randomPath = pathsToSimulate[Math.floor(Math.random() * pathsToSimulate.length)];
      triggerPulse(randomPath);
    }, 300);
  } else {
    simBtn.classList.remove('running');
    simBtn.textContent = '▶ SIMULAÇÃO AO VIVO';
    tip.textContent = 'Simulação pausada.';
    clearInterval(simInterval);
    pathsToSimulate.forEach(pId => {
      const p = document.getElementById('pulse-' + pId.replace('path-', ''));
      if (p) p.style.opacity = '0';
    });
  }
});

// Exportar SVG
document.getElementById('download').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', NS);
  const styleEl = document.createElementNS(NS, 'style');
  styleEl.textContent = document.querySelector('style').textContent;
  clone.insertBefore(styleEl, clone.firstChild);

  const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Cleitin_Core_v2_Simulacao.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  tip.textContent = 'Ficheiro exportado com sucesso!';
});

applyTransform();
